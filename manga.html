<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>漫画</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap');
html[data-theme="day"]{
  --paper:#f7f0e4; --paper-2:#eee3d0; --ink:#26222a; --body:#3f3a3f;
  --sec:#655a50; --helper:#8a7f73; --acc:#dd5a41; --acc-ink:#b0452f; --acc-on:#fff7f1;
  --line:#ded2be; --line-subtle:#ece0cc; --line-strong:#c8bba6;
  --sheet:rgba(247,240,228,.94); --page-bg:#efe6d6;
}
html[data-theme="night"]{
  --paper:#1c1a1f; --paper-2:#262329; --ink:#ece4d6; --body:#d5cbbd;
  --sec:#b3a794; --helper:#8a8076; --acc:#e8806a; --acc-ink:#f0b3a2; --acc-on:#1c1a1f;
  --line:#312b29; --line-subtle:#252120; --line-strong:#443c34;
  --sheet:rgba(28,26,31,.94); --page-bg:#121014;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font-family:'Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:'Source Serif 4','Noto Serif SC',serif}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:inherit}

/* 顶栏 */
.top{position:sticky;top:0;z-index:20;background:var(--sheet);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-subtle);display:flex;align-items:center;gap:12px;
  padding:14px 18px;max-width:960px;margin:0 auto}
.top h1{font-family:'Source Serif 4','Noto Serif SC',serif;font-size:1.25rem;letter-spacing:.04em;
  margin:0;color:var(--ink);font-weight:600}
.top .n{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--helper)}
.top .sp{flex:1}
.icon{border:1px solid var(--line);background:transparent;color:var(--sec);border-radius:3px;
  font-size:.75rem;padding:5px 10px;cursor:pointer;transition:.15s}
.icon:hover{border-color:var(--acc);color:var(--acc)}

/* 书架 */
.wrap{max-width:960px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px 14px}
.card{cursor:pointer}
.card .cover{aspect-ratio:3/4;border:1px solid var(--line);border-radius:2px;overflow:hidden;
  background:var(--page-bg);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.card:hover .cover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(30,24,18,.16)}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{margin-top:7px;font-family:'Source Serif 4','Noto Serif SC',serif;font-size:.78rem;
  line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--helper);margin-top:2px}
.empty{color:var(--helper);text-align:center;padding:60px 0;font-size:.9rem}

/* 阅读器 */
#reader{position:fixed;inset:0;z-index:60;background:var(--page-bg);display:none;overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#reader.on{display:block}
.rbar{position:fixed;top:0;left:0;right:0;z-index:61;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--sheet);border-bottom:1px solid var(--line-subtle);
  transition:transform .25s ease,opacity .25s ease}
.rbar.hide{transform:translateY(-100%);opacity:0}
.rbar .name{flex:1;font-family:'Source Serif 4','Noto Serif SC',serif;font-size:.9rem;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar .pg{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--helper)}
.pages{padding-top:52px;padding-bottom:40px}
.pages img{display:block;width:100%;max-width:820px;margin:0 auto;background:#fff}
html[data-theme="night"] .pages img{background:#0b0a0c}
.pages img+.pages img{margin-top:0}
.pages .ph{width:100%;max-width:820px;margin:0 auto;aspect-ratio:3/4.2;background:var(--paper-2);border-bottom:1px solid var(--line-subtle)}
.endpad{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.72rem;
  color:var(--helper);padding:28px 0 50px}

/* 章节选择 */
#chapters{position:fixed;inset:0;z-index:70;background:rgba(20,16,14,.55);display:none;
  align-items:center;justify-content:center;padding:24px}
#chapters.on{display:flex}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;max-width:460px;
  width:100%;max-height:70vh;overflow:auto;padding:18px}
.sheet h3{margin:0 0 12px;font-family:'Source Serif 4','Noto Serif SC',serif;font-size:1rem;color:var(--ink)}
.sheet button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-subtle);
  background:transparent;padding:10px 4px;font-size:.85rem;color:var(--body);cursor:pointer}
.sheet button:hover{color:var(--acc)}

/* 进度条 */
.progress{position:fixed;left:0;top:0;height:2px;background:var(--acc);z-index:62;width:0;transition:width .1s linear}
</style>
</head>
<body>
<div class="top">
  <h1>漫画</h1>
  <span class="n" id="stat"></span>
  <span class="sp"></span>
  <button class="icon" id="themeBtn">☾</button>
</div>

<div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">正在读目录…</div>
</div>

<div id="reader">
  <div class="progress" id="prog"></div>
  <div class="rbar" id="rbar">
    <button class="icon" id="backBtn">←</button>
    <span class="name" id="rname"></span>
    <span class="pg" id="rpg"></span>
    <button class="icon" id="chapBtn" style="display:none">章节</button>
  </div>
  <div class="pages" id="pages"></div>
</div>

<div id="chapters"><div class="sheet"><h3>选择章节</h3><div id="chapList"></div></div></div>

<script>
const KEY_THEME = "manga_theme";
let INDEX = null;
let cur = null;          // {series, chapterIndex}
let pageEls = [];
let io = null;

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeBtn").textContent = t === "night" ? "☀" : "☾";
  try{ localStorage.setItem(KEY_THEME, t); }catch(e){}
}
document.getElementById("themeBtn").onclick = () => {
  applyTheme(document.documentElement.getAttribute("data-theme") === "night" ? "day" : "night");
};
applyTheme((()=>{ try{ return localStorage.getItem(KEY_THEME) || "day"; }catch(e){ return "day"; } })());

function pageUrl(series, ci, pi){
  return INDEX.base + "/m/" + series.slug + "/" + String(ci).padStart(2,"0") + "/" + String(pi).padStart(4,"0") + ".webp";
}

function coverUrl(series){
  return pageUrl(series, 0, 1);
}

function renderShelf(){
  const grid = document.getElementById("grid");
  const stat = document.getElementById("stat");
  const list = INDEX.series || [];
  stat.textContent = list.length + " 部";
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  document.getElementById("empty").textContent = list.length ? "" : "还没有上传完的漫画";
  grid.innerHTML = "";
  list.forEach(s => {
    const pages = s.chapters.reduce((a,c)=>a+c.count,0);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="cover"><img loading="lazy" referrerpolicy="no-referrer" alt=""></div>'
                   + '<div class="t"></div><div class="m"></div>';
    const img = card.querySelector("img");
    img.src = coverUrl(s);
    img.onerror = () => { img.style.display = "none"; };
    card.querySelector(".t").textContent = s.name;
    card.querySelector(".m").textContent = pages + " 页" + (s.chapters.length > 1 ? " · " + s.chapters.length + " 话" : "");
    card.onclick = () => openReader(s, 0);
    grid.appendChild(card);
  });
}

function openReader(series, ci){
  cur = { series, ci };
  const r = document.getElementById("reader");
  r.classList.add("on");
  r.scrollTop = 0;
  document.body.style.overflow = "hidden";
  document.getElementById("rname").textContent = series.name + (series.chapters.length > 1 ? " · " + series.chapters[ci].title : "");
  document.getElementById("chapBtn").style.display = series.chapters.length > 1 ? "" : "none";
  buildPages();
  history.pushState({ reader: true }, "");
}

function buildPages(){
  const box = document.getElementById("pages");
  box.innerHTML = "";
  pageEls = [];
  const ch = cur.series.chapters[cur.ci];
  for (let i = 1; i <= ch.count; i++){
    const wrap = document.createElement("div");
    wrap.className = "ph";
    wrap.dataset.page = i;
    const img = document.createElement("img");
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    img.alt = "";
    img.onload = () => { wrap.className = ""; wrap.style.aspectRatio = "auto"; if (i === restorePage) wrap.scrollIntoView({ block: "start" }); };
    img.onerror = () => { img.remove(); wrap.style.aspectRatio = "3/4.2"; };
    img.src = pageUrl(cur.series, cur.ci, i);
    wrap.appendChild(img);
    box.appendChild(wrap);
    pageEls.push(wrap);
  }
  const end = document.createElement("div");
  end.className = "endpad";
  end.textContent = "— 本话完 · " + ch.count + " 页 —";
  box.appendChild(end);

  // 跳到上次读到的页
  const saved = getProgress(cur.series.slug, cur.ci);
  if (saved > 1 && pageEls[saved - 1]) {
    setTimeout(()=>pageEls[saved - 1].scrollIntoView({ block: "start" }), 60);
  }
  observe();
  updatePager();
}

function observe(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (e.isIntersecting) {
        const p = +e.target.dataset.page;
        setProgress(cur.series.slug, cur.ci, p);
        document.getElementById("rpg").textContent = p + " / " + cur.series.chapters[cur.ci].count;
      }
    });
  }, { root: document.getElementById("reader"), threshold: 0.4 });
  pageEls.forEach(el => io.observe(el));
}

function updatePager(){
  const p = getProgress(cur.series.slug, cur.ci) || 1;
  document.getElementById("rpg").textContent = p + " / " + cur.series.chapters[cur.ci].count;
}

function progressKey(slug, ci){ return "manga_p_" + slug + "_" + ci; }
function getProgress(slug, ci){ try{ return +(localStorage.getItem(progressKey(slug,ci)) || 0); }catch(e){ return 0; } }
function setProgress(slug, ci, p){ try{ localStorage.setItem(progressKey(slug,ci), p); }catch(e){} }

function closeReader(){
  document.getElementById("reader").classList.remove("on");
  document.body.style.overflow = "";
  if (io) io.disconnect();
}
document.getElementById("backBtn").onclick = () => { closeReader(); history.back(); };
window.addEventListener("popstate", () => { if (document.getElementById("reader").classList.contains("on")) closeReader(); });

// 滚动：进度条 + 顶栏自动隐藏
document.getElementById("reader").addEventListener("scroll", () => {
  const r = document.getElementById("reader");
  const max = r.scrollHeight - r.clientHeight;
  document.getElementById("prog").style.width = (max > 0 ? (r.scrollTop / max * 100) : 0) + "%";
  const bar = document.getElementById("rbar");
  if (r.scrollTop > lastScrollY + 12) bar.classList.add("hide");
  else if (r.scrollTop < lastScrollY - 12) bar.classList.remove("hide");
  lastScrollY = r.scrollTop;
}, { passive: true });
let lastScrollY = 0;

// 章节
document.getElementById("chapBtn").onclick = () => {
  const list = document.getElementById("chapList");
  list.innerHTML = "";
  cur.series.chapters.forEach((c, i) => {
    const b = document.createElement("button");
    b.textContent = c.title + "（" + c.count + " 页）";
    b.onclick = () => {
      document.getElementById("chapters").classList.remove("on");
      cur.ci = i;
      document.getElementById("rname").textContent = cur.series.name + (cur.series.chapters.length > 1 ? " · " + c.title : "");
      buildPages();
      document.getElementById("reader").scrollTop = 0;
    };
    list.appendChild(b);
  });
  document.getElementById("chapters").classList.add("on");
};
document.getElementById("chapters").onclick = e => {
  if (e.target.id === "chapters") e.currentTarget.classList.remove("on");
};

// 载入目录
fetch("manga.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.json())
  .then(j => { INDEX = j; renderShelf(); })
  .catch(() => {
    document.getElementById("empty").textContent = "目录没读到（manga.json 还没生成）";
  });
</script>
</body>
</html>
